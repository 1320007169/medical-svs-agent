[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-svs-agent"
version = "0.1.0"
description = "SFT and GRPO training pipeline for whole-slide medical image agents"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "datasets>=2.18",
  "fastapi>=0.110",
  "openslide-python>=1.3",
  "pillow>=10",
  "pyarrow>=15",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

