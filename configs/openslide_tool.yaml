tools:
  - class_name: medical_svs_agent.verl_tool.OpenSlideCropTool
    config:
      base_url: ${oc.env:OPENSLIDE_TOOL_API_BASE,http://127.0.0.1:9010}
      api_key: ${oc.env:OPENSLIDE_TOOL_API_KEY,''}
      timeout: ${oc.env:OPENSLIDE_TOOL_TIMEOUT,120}
      max_retries: ${oc.env:OPENSLIDE_TOOL_MAX_RETRIES,2}
    tool_schema:
      type: function
      function:
        name: openslide_crop
        description: Inspect a selected region of the original whole-slide image at higher resolution. Coordinates range from 0 to 1000; level 0 is highest resolution.
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              description: Relative [x1, y1, x2, y2] region on the overview.
            level:
              type: integer
              description: OpenSlide pyramid level; defaults to 0.
          required: [bbox_2d]

